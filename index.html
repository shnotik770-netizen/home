<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משימות הבית והמשפחה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing:border-box; }
        body { font-family: 'Rubik', sans-serif; overflow-x:hidden; }
        #tasks-container { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.65rem; align-items:start; width:100%; }
        #tasks-container > div { min-width:0; max-width:100%; }
        #tasks-container input[type="text"] { min-width:0; width:100%; }
        #tasks-container select { max-width:100%; min-width:0; }
        #assignee-filter-bar { display:flex; flex-wrap:wrap; gap:.3rem; max-width:100%; max-height:58px; overflow:hidden; align-content:flex-start; padding:1px 0; }
        #assignee-filter-bar button { flex:0 0 auto; padding:.22rem .5rem !important; font-size:10px !important; line-height:1.25; }
        #tasks-container { grid-template-columns:repeat(2,minmax(0,1fr)); }
        @media (max-width: 390px) { #tasks-container { grid-template-columns:repeat(2,minmax(0,1fr)); gap:.4rem; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-teal-600 text-white rounded-xl text-xl">🏡</div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900">משימות הבית והמשפחה</h1>
                    <p id="hebrew-header-date" class="text-xs font-semibold text-teal-700">טוען תאריך עברי...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="sync-status" class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">מתחבר...</span>
                <button onclick="loadTasks()" class="bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 text-xs font-bold px-3 py-1.5 rounded-lg transition">🔄 רענן</button>
                <button type="button" onclick="toggleAddTask()" id="add-task-toggle" aria-expanded="false" title="הוספת משימה" class="bg-teal-600 hover:bg-teal-700 text-white text-lg font-bold w-9 h-9 rounded-lg transition">＋</button>
                <button onclick="toggleSettings()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">⚙️ הגדרות</button>
            </div>
        </div>

        <!-- פאנל הגדרות, קטגוריות ושמות -->
        <div id="settings-bar" class="hidden bg-slate-100 border-t border-slate-200 px-4 py-5 shadow-inner">
            <div class="max-w-5xl mx-auto space-y-5">
                <div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row gap-2 items-center">
                    <label class="text-xs font-bold text-slate-700 shrink-0">קישור Web App URL:</label>
                    <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-mono">
                    <button onclick="saveUrl()" class="w-full sm:w-auto bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-4 py-1.5 rounded-lg">שמור והתחבר</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
                        <h3 class="font-bold text-sm text-slate-900">📂 ניהול רשימת קטגוריות</h3>
                        <div class="flex gap-2">
                            <input type="text" id="new-category-input" placeholder="שם קטגוריה חדשה..." class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                            <button onclick="addCategory()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">הוסף</button>
                        </div>
                        <div id="manage-categories-list" class="flex flex-wrap gap-1.5"></div>
                    </div>

                    <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
                        <h3 class="font-bold text-sm text-slate-900">👥 ניהול שמות (לשיוך משימות)</h3>
                        <div class="flex gap-2">
                            <input type="text" id="new-assignee-input" placeholder="הוסף שם חדש..." class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                            <button onclick="addAssignee()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">הוסף</button>
                        </div>
                        <div id="manage-assignees-list" class="flex flex-wrap gap-1.5"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

        <section id="add-task-panel" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-4">
            <form onsubmit="addTask(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                <input type="text" id="task-title" required placeholder="מה צריך לעשות?" class="sm:col-span-5 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                
                <select id="task-category" class="sm:col-span-2 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"></select>

                <select id="task-assignee" class="sm:col-span-2 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500"></select>

                <select id="task-priority" class="sm:col-span-2 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-teal-500">
                    <option value="היום">🔥 1 - היום</option>
                    <option value="דחוף">🔴 2 - דחוף</option>
                    <option value="רגיל" selected>🟡 3 - רגיל</option>
                    <option value="נמוך">🟢 4 - כשמתפנה</option>
                </select>

                <button type="submit" class="sm:col-span-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-sm">הוסף</button>
            </form></section>

        <!-- סרגל סינון, מיון ותצוגה (נשמר בזיכרון) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div id="assignee-filter-bar" class="flex flex-wrap items-center gap-1.5"></div>
                
                <label class="flex items-center gap-1.5 text-xs font-bold text-slate-700 cursor-pointer bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                    <input type="checkbox" id="show-done" onchange="onPreferenceChange()" class="accent-teal-600 w-4 h-4">
                    הצג הושלמו
                </label>
            </div>

            <div class="pt-2.5 border-t border-slate-100 flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-1.5">
                    <span class="text-xs font-bold text-slate-500">📂 קטגוריה:</span>
                    <select id="filter-category" onchange="onPreferenceChange()" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 font-medium text-slate-700 focus:outline-none">
                        <option value="הכל">כל הקטגוריות</option>
                    </select>
                </div>

                <div class="flex items-center gap-1.5">
                    <span class="text-xs font-bold text-slate-500">↕️ מיון לפי:</span>
                    <select id="sort-by" onchange="onPreferenceChange()" class="text-xs bg-indigo-50/60 border border-indigo-200 rounded-xl px-3 py-1.5 font-bold text-indigo-900 focus:outline-none">
                        <option value="priority">דחיפות (מהיום ומטה)</option>
                        <option value="newest">הכי חדשות (למעלה)</option>
                        <option value="oldest">הכי ישנות (למעלה)</option>
                        <option value="progress_desc">אחוזי התקדמות (מהגבוה לנמוך)</option>
                        <option value="progress_asc">אחוזי התקדמות (מהנמוך לגבוה)</option>
                        <option value="category">לפי קטגוריה</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- רשימת המשימות -->
        <div id="tasks-container" class="grid grid-cols-2 gap-2.5 items-start"></div>

    </main>

    <div id="edit-task-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 p-4 flex items-center justify-center" role="dialog" aria-modal="true"><div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-5 space-y-3">
    <div class="flex justify-between"><b>עריכת משימה</b><button onclick="closeEditTask()">×</button></div><input id="edit-task-id" type="hidden">
    <label class="block text-xs font-bold">שם המשימה<input id="edit-task-title" class="mt-1 w-full p-3 border rounded-xl"></label>
    <label class="block text-xs font-bold">קטגוריה<select id="edit-task-category" class="mt-1 w-full p-3 border rounded-xl"></select></label>
    <label class="block text-xs font-bold">שיוך<select id="edit-task-assignee" class="mt-1 w-full p-3 border rounded-xl"></select></label>
    <label class="block text-xs font-bold">דחיפות<select id="edit-task-priority" class="mt-1 w-full p-3 border rounded-xl"><option value="היום">🔥 1 - היום</option><option value="דחוף">🔴 2 - דחוף</option><option value="רגיל">🟡 3 - רגיל</option><option value="נמוך">🟢 4 - כשמתפנה</option></select></label>
    <label class="block text-xs font-bold">סטטוס נוכחי<textarea id="edit-task-progress" rows="3" class="mt-1 w-full p-3 border rounded-xl"></textarea></label>
    <div class="flex gap-2"><button onclick="saveEditedTask()" class="flex-1 bg-teal-600 text-white font-bold p-3 rounded-xl">שמור שינויים</button><button onclick="closeEditTask()" class="p-3 bg-slate-100 rounded-xl">ביטול</button></div></div></div>
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

    <script>
        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwpQU7Lo82w0NitG02dMvY5WhwOPA5ZIYCiNMRDtBob5mBloVt3lIHygDXEvpWJciPNMg/exec";
        let gasUrl = localStorage.getItem('home_gas_url') || DEFAULT_GAS_URL;
        let tasks = [];
        let categories = ['🛠️ בית ותחזוקה', '🧸 ילדים וחינוך', '🛒 קניות וסידורים', '💳 כספים ובירוקרטיה', '📌 כללי'];
        let assignees = ['שמוליק', 'מושקא', 'משותף'];
        let expandedHistoryIds = new Set();

        // טעינת העדפות תצוגה שנשמרו בפעם הקודמת
        let savedPrefs = {};
        try { savedPrefs = JSON.parse(localStorage.getItem('home_view_prefs') || '{}'); } catch(e) {}
        let filterAssignee = savedPrefs.filterAssignee || 'הכל';

        function savePrefs() {
            const prefs = {
                filterAssignee: filterAssignee,
                filterCategory: document.getElementById('filter-category').value,
                sortBy: document.getElementById('sort-by').value,
                showDone: document.getElementById('show-done').checked
            };
            localStorage.setItem('home_view_prefs', JSON.stringify(prefs));
        }

        function onPreferenceChange() {
            savePrefs();
            renderTasks();
        }

        const TASK_CACHE_KEY='home_tasks_cache_v1';
        function saveTasksCache(){try{localStorage.setItem(TASK_CACHE_KEY,JSON.stringify({tasks:tasks,savedAt:Date.now()}));}catch(e){}}
        function loadTasksCache(){try{const x=JSON.parse(localStorage.getItem(TASK_CACHE_KEY)||'null');if(x&&Array.isArray(x.tasks)){tasks=x.tasks;return true;}}catch(e){}return false;}
        function toggleAddTask(){const p=document.getElementById('add-task-panel');const open=p.classList.contains('hidden');p.classList.toggle('hidden',!open);document.getElementById('add-task-toggle').textContent=open?'×':'＋';document.getElementById('add-task-toggle').setAttribute('aria-expanded',String(open));if(open)document.getElementById('task-title').focus();}
        function openEditTask(id){const t=tasks.find(x=>String(x.id)===String(id));if(!t)return;document.getElementById('edit-task-id').value=t.id;document.getElementById('edit-task-title').value=t.title||'';document.getElementById('edit-task-category').innerHTML=categories.map(x=>'<option>'+escapeHtml(x)+'</option>').join('');document.getElementById('edit-task-assignee').innerHTML=assignees.map(x=>'<option>'+escapeHtml(x)+'</option>').join('');document.getElementById('edit-task-category').value=t.category;document.getElementById('edit-task-assignee').value=t.assignee;document.getElementById('edit-task-priority').value=t.priority||'רגיל';document.getElementById('edit-task-progress').value=t.progress||'';document.getElementById('edit-task-modal').classList.remove('hidden');}
        function closeEditTask(){document.getElementById('edit-task-modal').classList.add('hidden');}
        function saveEditedTask(){
            const id=document.getElementById('edit-task-id').value;
            const t=tasks.find(x=>String(x.id)===String(id));
            if(!t)return;
            const v={title:document.getElementById('edit-task-title').value.trim(),category:document.getElementById('edit-task-category').value,assignee:document.getElementById('edit-task-assignee').value,priority:document.getElementById('edit-task-priority').value,progress:document.getElementById('edit-task-progress').value.trim()};
            if(!v.title){showToast('צריך להזין שם למשימה');return;}
            const stamp=getShortHebrewStamp();
            if(!Array.isArray(t.history))t.history=[];
            t.history.unshift({date:stamp,text:'פרטי המשימה נערכו'});
            Object.assign(t,v,{updatedAt:stamp});
            saveTasksCache();closeEditTask();renderTasks();
            setStatus('מעדכן...','bg-amber-50 text-amber-700');
            fetchJSONP({action:'updateTask',id:id,updates:JSON.stringify({title:t.title,category:t.category,assignee:t.assignee,priority:t.priority,progress:t.progress,updatedAt:t.updatedAt,history:t.history})})
              .then(()=>setStatus('מסונכרן ✓','bg-emerald-50 text-emerald-700'))
              .catch(()=>setStatus('שגיאת עדכון','bg-rose-50 text-rose-700'));
        }


        // תאריך עברי + יום בשבוע + שעה
        function getHebrewDateString(dateObj = new Date()) {
            const weekday = new Intl.DateTimeFormat('he-IL', { weekday: 'long' }).format(dateObj);
            const hebDate = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { calendar: 'hebrew', day: 'numeric', month: 'long', year: 'numeric' }).format(dateObj);
            return `${weekday}, ${hebDate}`;
        }

        function getShortHebrewStamp() {
            const now = new Date();
            const weekday = new Intl.DateTimeFormat('he-IL', { weekday: 'short' }).format(now);
            const hebDate = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { calendar: 'hebrew', day: 'numeric', month: 'short' }).format(now);
            const time = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
            return `יום ${weekday} (${hebDate}) ${time}`;
        }

        window.onload = function() {
            document.getElementById('hebrew-header-date').innerText = '📅 ' + getHebrewDateString(new Date());
            document.getElementById('gas-url').value = gasUrl;
            
            // שחזור הגדרות תצוגה שמורות
            if (savedPrefs.sortBy) document.getElementById('sort-by').value = savedPrefs.sortBy;
            if (savedPrefs.showDone !== undefined) document.getElementById('show-done').checked = savedPrefs.showDone;

            refreshDropdownsAndManagement();
            if (savedPrefs.filterCategory) document.getElementById('filter-category').value = savedPrefs.filterCategory;
            if(loadTasksCache()){setStatus('נתונים שמורים · בודק סנכרון…','bg-amber-50 text-amber-700');renderTasks();}
            loadTasks();
        };

        function toggleSettings() {
            document.getElementById('settings-bar').classList.toggle('hidden');
        }

        function saveUrl() {
            const val = document.getElementById('gas-url').value.trim();
            if (!val) return;
            gasUrl = val;
            localStorage.setItem('home_gas_url', gasUrl);
            loadTasks();
        }

        // ====== ניהול קטגוריות ושמות ======
        function refreshDropdownsAndManagement() {
            const catSelect = document.getElementById('task-category');
            const filterCatSelect = document.getElementById('filter-category');
            const currentFilterCat = filterCatSelect.value || savedPrefs.filterCategory || 'הכל';

            catSelect.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            filterCatSelect.innerHTML = `<option value="הכל">כל הקטגוריות</option>` + 
                categories.map(c => `<option value="${escapeHtml(c)}" ${c === currentFilterCat ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');

            const assSelect = document.getElementById('task-assignee');
            assSelect.innerHTML = assignees.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');

            document.getElementById('manage-categories-list').innerHTML = categories.map((c, idx) => `
                <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-800 text-xs font-medium px-2.5 py-1 rounded-lg border border-slate-200">
                    ${escapeHtml(c)}
                    <button onclick="removeCategory(${idx})" class="text-slate-400 hover:text-rose-600 font-bold">✕</button>
                </span>
            `).join('');

            document.getElementById('manage-assignees-list').innerHTML = assignees.map((a, idx) => `
                <span class="inline-flex items-center gap-1.5 bg-teal-50 text-teal-800 text-xs font-medium px-2.5 py-1 rounded-lg border border-teal-200">
                    ${escapeHtml(a)}
                    <button onclick="removeAssignee(${idx})" class="text-teal-400 hover:text-rose-600 font-bold">✕</button>
                </span>
            `).join('');
        }

        function addCategory() {
            const input = document.getElementById('new-category-input');
            const val = input.value.trim();
            if (!val || categories.includes(val)) return;
            categories.push(val);
            input.value = '';
            refreshDropdownsAndManagement();
            saveConfigToSheets();
        }

        function removeCategory(idx) {
            if (categories.length <= 1) { showToast('חייבת להישאר לפחות קטגוריה אחת'); return; }
            categories.splice(idx, 1);
            refreshDropdownsAndManagement();
            saveConfigToSheets();
        }

        function addAssignee() {
            const input = document.getElementById('new-assignee-input');
            const val = input.value.trim();
            if (!val || assignees.includes(val)) return;
            assignees.push(val);
            input.value = '';
            refreshDropdownsAndManagement();
            renderTasks();
            saveConfigToSheets();
        }

        function removeAssignee(idx) {
            if (assignees.length <= 1) { showToast('חייב להישאר לפחות שם אחד'); return; }
            const removed = assignees[idx];
            if (filterAssignee === removed) { filterAssignee = 'הכל'; savePrefs(); }
            assignees.splice(idx, 1);
            refreshDropdownsAndManagement();
            renderTasks();
            saveConfigToSheets();
        }

        function saveConfigToSheets() {
            if (!gasUrl) return;
            setStatus('שומר הגדרות...', 'bg-amber-50 text-amber-700');
            fetchJSONP({
                action: 'saveConfig',
                categories: JSON.stringify(categories),
                assignees: JSON.stringify(assignees)
            }).then(() => {
                setStatus('מסונכרן ✓', 'bg-emerald-50 text-emerald-700');
                showToast('הרשימה נשמרה בגוגל שיטס!');
            });
        }

        // ====== תקשורת מול גוגל שיטס ======
        function fetchJSONP(params) {
            return new Promise((resolve, reject) => {
                if (!gasUrl) { reject('No URL'); return; }
                const cbName = 'cb_' + Math.round(Math.random() * 1000000);
                window[cbName] = function(data) {
                    resolve(data);
                    delete window[cbName];
                    document.getElementById(cbName)?.remove();
                };
                const q = new URLSearchParams(params);
                q.set('callback', cbName);
                const script = document.createElement('script');
                script.id = cbName;
                script.src = gasUrl + (gasUrl.includes('?') ? '&' : '?') + q.toString();
                script.onerror = () => { reject('Network error'); delete window[cbName]; };
                document.body.appendChild(script);
            });
        }

        function setStatus(text, colorClass) {
            const el = document.getElementById('sync-status');
            el.innerText = text;
            el.className = `text-xs font-semibold px-2.5 py-1 rounded-lg ${colorClass}`;
        }

        function loadTasks() {
            setStatus('טוען נתונים...', 'bg-amber-50 text-amber-700');
            fetchJSONP({ action: 'loadAll' })
                .then(res => {
                    if (res.status === 'success') {
                        tasks = res.tasks || [];
                        saveTasksCache();
                        if (res.categories && res.categories.length) categories = res.categories;
                        if (res.assignees && res.assignees.length) assignees = res.assignees;
                        refreshDropdownsAndManagement();
                        if (savedPrefs.filterCategory && categories.includes(savedPrefs.filterCategory)) {
                            document.getElementById('filter-category').value = savedPrefs.filterCategory;
                        }
                        setStatus('מסונכרן ✓', 'bg-emerald-50 text-emerald-700');
                        renderTasks();
                    } else {
                        setStatus('שגיאת שרת', 'bg-rose-50 text-rose-700');
                    }
                })
                .catch(() => setStatus(tasks.length ? 'אין חיבור · מוצגים נתונים שמורים' : 'שגיאת חיבור', tasks.length ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-700'));
        }

        function addTask(e) {
            e.preventDefault();
            if (!gasUrl) { showToast('נא להגדיר קישור גוגל שיטס קודם'); return; }
            const title = document.getElementById('task-title').value.trim();
            if (!title) return;

            const stamp = getShortHebrewStamp();
            const newTask = {
                id: Date.now(),
                title: title,
                category: document.getElementById('task-category').value,
                assignee: document.getElementById('task-assignee').value,
                priority: document.getElementById('task-priority').value,
                status: 'פתוח',
                progress: '',
                percent: 0,
                updatedAt: stamp,
                history: [{ date: stamp, text: `המשימה נוצרה (שויכה ל-${document.getElementById('task-assignee').value})` }]
            };

            tasks.unshift(newTask);
            saveTasksCache();
            toggleAddTask();
            document.getElementById('task-title').value = '';
            renderTasks();

            setStatus('שומר...', 'bg-amber-50 text-amber-700');
            fetchJSONP({ action: 'addTask', task: JSON.stringify(newTask) })
                .then(() => { setStatus('נשמר ✓', 'bg-emerald-50 text-emerald-700'); showToast('המשימה נוספה!'); })
                .catch(() => setStatus('שגיאה בשמירה', 'bg-rose-50 text-rose-700'));
        }

        function updateTaskField(id, field, value) {
            const t = tasks.find(x => x.id === id);
            if (!t) return;
            
            const stamp = getShortHebrewStamp();
            if (!Array.isArray(t.history)) t.history = [];

            // יצירת רשומה ברורה להיסטוריית הפעולות
            let logText = '';
            if (field === 'progress') {
                if (value.trim() === (t.progress || '').trim()) return;
                logText = value.trim() ? `עדכון התקדמות: "${value.trim()}"` : 'נמחקה הערת ההתקדמות';
            } else if (field === 'percent') {
                value = Number(value);
                if (value === Number(t.percent || 0)) return;
                logText = `אחוז התקדמות עודכן ל-${value}%`;
                if (value === 100 && t.status !== 'הושלם') {
                    t.status = 'הושלם';
                    logText += ' (המשימה סומנה כהושלמה)';
                }
            } else if (field === 'status') {
                logText = value === 'הושלם' ? '✅ המשימה סומנה כהושלמה' : '🔄 המשימה נפתחה מחדש';
                if (value === 'הושלם' && (t.percent || 0) < 100) t.percent = 100;
            } else if (field === 'assignee') {
                logText = `השיוך הועבר ל-${value}`;
            } else if (field === 'priority') {
                logText = `הדחיפות שונתה ל-${value}`;
            } else if (field === 'category') {
                logText = `הקטגוריה שונתה ל-${value}`;
            }

            t[field] = value;
            saveTasksCache();
            t.updatedAt = stamp;
            if (logText) {
                t.history.unshift({ date: stamp, text: logText });
            }

            renderTasks();

            setStatus('מעדכן...', 'bg-amber-50 text-amber-700');
            const updates = {
                [field]: value,
                status: t.status,
                percent: t.percent,
                updatedAt: t.updatedAt,
                history: t.history
            };
            fetchJSONP({ action: 'updateTask', id: id, updates: JSON.stringify(updates) })
                .then(() => setStatus('מסונכרן ✓', 'bg-emerald-50 text-emerald-700'))
                .catch(() => setStatus('שגיאת עדכון', 'bg-rose-50 text-rose-700'));
        }

        function deleteTask(id) {
            if (!confirm('למחוק משימה זו לצמיתות?')) return;
            tasks = tasks.filter(x => x.id !== id);
            saveTasksCache();
            renderTasks();
            fetchJSONP({ action: 'deleteTask', id: id })
                .then(() => showToast('המשימה נמחקה'));
        }

        function setFilterAssignee(who) {
            filterAssignee = who;
            savePrefs();
            renderTasks();
        }

        function toggleTaskHistory(id) {
            if (expandedHistoryIds.has(id)) expandedHistoryIds.delete(id);
            else expandedHistoryIds.add(id);
            renderTasks();
        }

        const palette = [
            'bg-sky-100 text-sky-800 border-sky-200',
            'bg-rose-100 text-rose-800 border-rose-200',
            'bg-purple-100 text-purple-800 border-purple-200',
            'bg-amber-100 text-amber-800 border-amber-200',
            'bg-emerald-100 text-emerald-800 border-emerald-200',
            'bg-indigo-100 text-indigo-800 border-indigo-200'
        ];
        function getAssigneeStyle(name) {
            const idx = assignees.indexOf(name);
            return palette[idx >= 0 ? idx % palette.length : 0];
        }

        function renderTasks() {
            const showDone = document.getElementById('show-done').checked;
            const filterCat = document.getElementById('filter-category').value;
            const sortBy = document.getElementById('sort-by').value;
            const openTasks = tasks.filter(t => t.status !== 'הושלם');

            // בניית סרגל כפתורי שמות דינמי (כולל ספירה משולבת של "משותף" עבור שמוליק/מושקא)
            const filterBar = document.getElementById('assignee-filter-bar');
            let buttonsHtml = `<button onclick="setFilterAssignee('הכל')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${filterAssignee === 'הכל' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">הכל (${openTasks.length})</button>`;
            
            assignees.forEach(name => {
                // אם זה שם אישי (לא "משותף"), הספירה כוללת גם את המשימות המשותפות
                const count = (name === 'משותף')
                    ? openTasks.filter(t => t.assignee === 'משותף').length
                    : openTasks.filter(t => t.assignee === name || t.assignee === 'משותף').length;
                
                const activeRing = filterAssignee === name ? 'ring-2 ring-offset-1 ring-slate-800' : 'opacity-85 hover:opacity-100';
                buttonsHtml += `<button onclick="setFilterAssignee('${escapeHtml(name)}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${getAssigneeStyle(name)} ${activeRing}">${escapeHtml(name)} (${count})</button>`;
            });
            filterBar.innerHTML = buttonsHtml;

            // סינון משימות: בחירה בשמוליק או מושקא מציגה גם משימות "משותף"
            let filtered = tasks.filter(t => {
                if (!showDone && t.status === 'הושלם') return false;
                if (filterAssignee !== 'הכל') {
                    if (filterAssignee === 'משותף') {
                        if (t.assignee !== 'משותף') return false;
                    } else {
                        if (t.assignee !== filterAssignee && t.assignee !== 'משותף') return false;
                    }
                }
                if (filterCat !== 'הכל' && t.category !== filterCat) return false;
                return true;
            });

            // מיון גמיש לפי הבחירה השמורה
            const prioWeight = { 'היום': 1, 'דחוף': 2, 'רגיל': 3, 'נמוך': 4 };
            filtered.sort((a, b) => {
                // משימות שהושלמו תמיד יורדות לסוף הרשימה
                if ((a.status === 'הושלם') !== (b.status === 'הושלם')) return a.status === 'הושלם' ? 1 : -1;
                
                if (sortBy === 'newest') return b.id - a.id;
                if (sortBy === 'oldest') return a.id - b.id;
                if (sortBy === 'progress_desc') return (Number(b.percent) || 0) - (Number(a.percent) || 0);
                if (sortBy === 'progress_asc') return (Number(a.percent) || 0) - (Number(b.percent) || 0);
                if (sortBy === 'category') return (a.category || '').localeCompare(b.category || '', 'he');
                
                // ברירת מחדל: דחיפות
                return (prioWeight[a.priority] || 3) - (prioWeight[b.priority] || 3);
            });

            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-10 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">אין משימות להצגה בסינון הנוכחי 🎉</div>`;
                return;
            }

            filtered.forEach(t => {
                const isDone = t.status === 'הושלם';
                const pct = Number(t.percent) || 0;
                const isHistoryOpen = expandedHistoryIds.has(t.id);
                const histList = Array.isArray(t.history) ? t.history : [];

                const borderColor = {
                    'היום': 'border-r-red-600 bg-red-50/15',
                    'דחוף': 'border-r-orange-500',
                    'רגיל': 'border-r-amber-400',
                    'נמוך': 'border-r-emerald-400'
                }[t.priority] || 'border-r-slate-300';

                const assigneeOptions = assignees.map(a => 
                    `<option value="${escapeHtml(a)}" ${t.assignee === a ? 'selected' : ''}>${escapeHtml(a)}</option>`
                ).join('');

                const categoryOptions = categories.map(c => 
                    `<option value="${escapeHtml(c)}" ${t.category === c ? 'selected' : ''}>${escapeHtml(c)}</option>`
                ).join('');

                const historyHtml = histList.length > 0 
                    ? histList.map(h => `
                        <div class="flex items-start justify-between gap-2 text-xs py-1.5 border-b border-slate-100 last:border-0">
                            <span class="text-slate-700">• ${escapeHtml(h.text)}</span>
                            <span class="text-[11px] text-slate-400 shrink-0">${escapeHtml(h.date)}</span>
                        </div>`).join('')
                    : `<p class="text-xs text-slate-400 italic">טרם נרשמו פעולות בהיסטוריה.</p>`;

                const card = `
                <div class="bg-white p-2.5 sm:p-3 rounded-2xl border border-slate-200 border-r-4 ${borderColor} shadow-sm transition min-w-0 ${isDone ? 'opacity-65 bg-slate-50' : ''}">
                    <!-- שורה ראשית -->
                    <div class="flex flex-col gap-2 mb-2.5">
                        <div class="flex items-start gap-1.5 min-w-0">
                            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="updateTaskField(${t.id}, 'status', this.checked ? 'הושלם' : 'פתוח')" class="w-4 h-4 mt-0.5 accent-teal-600 cursor-pointer shrink-0">
                            <span class="font-bold text-[13px] leading-snug text-slate-900 break-words ${isDone ? 'line-through text-slate-500' : ''}">${escapeHtml(t.title)}</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-1.5 text-[10px] min-w-0">
                            <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 border border-slate-200 rounded-lg px-2 py-1 max-w-full">
                                <span>📂</span><span class="truncate">${escapeHtml(t.category || 'ללא קטגוריה')}</span>
                            </span>
                            <span class="inline-flex items-center gap-1 border rounded-lg px-2 py-1 max-w-full ${getAssigneeStyle(t.assignee)}">
                                <span>👤</span><span class="truncate">${escapeHtml(t.assignee || 'לא משויך')}</span>
                            </span>
                            <button onclick="openEditTask(${t.id})" class="text-teal-700 bg-teal-50 border border-teal-100 rounded-lg px-2 py-1 text-[10px] font-bold shrink-0">✏️ עריכה</button>
                            <button onclick="deleteTask(${t.id})" title="מחק" class="text-slate-400 hover:text-rose-600 px-1.5 text-sm shrink-0">🗑️</button>
                        </div>
                    </div>

                    <!-- פס התקדמות באחוזים -->
                    <div class="flex items-center gap-2 mb-2 px-0.5">
                        <span class="text-[10px] font-bold text-slate-600 shrink-0">התקדמות</span>
                        <input type="range" min="0" max="100" step="10" value="${pct}" 
                               onchange="updateTaskField(${t.id}, 'percent', this.value)"
                               oninput="this.nextElementSibling.innerText = this.value + '%'"
                               class="flex-1 accent-teal-600 cursor-pointer h-2 bg-slate-200 rounded-lg">
                        <span class="text-xs font-extrabold text-teal-700 w-10 text-left">${pct}%</span>
                    </div>

                    <!-- שורת עדכון התקדמות טקסטואלי + כפתור היסטוריה -->
                    <div class="flex flex-col items-stretch gap-1.5 bg-slate-50 p-2 rounded-xl border border-slate-100">
                        <span class="text-[10px] font-bold text-teal-700 shrink-0">📝 סטטוס נוכחי</span>
                        <input type="text" value="${escapeHtml(t.progress || '')}" 
                               placeholder="כתוב כאן מה נעשה לאחרונה..." 
                               onchange="updateTaskField(${t.id}, 'progress', this.value)"
                               onkeydown="if(event.key==='Enter') this.blur()"
                               class="w-full min-w-0 bg-transparent text-[11px] text-slate-800 focus:outline-none">
                        <button onclick="toggleTaskHistory(${t.id})" class="self-start text-[10px] font-bold bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-2 py-1 rounded-lg transition shrink-0">
                            📜 היסטוריה (${histList.length}) ${isHistoryOpen ? '▲' : '▼'}
                        </button>
                    </div>

                    <!-- מגירת היסטוריית פעולות מתקפלת -->
                    <div class="${isHistoryOpen ? '' : 'hidden'} mt-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80">
                        <div class="text-[11px] font-bold text-slate-500 mb-1.5">יומן פעולות ועדכונים למשימה זו:</div>
                        ${historyHtml}
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 3000);
        }
    </script>
</body>
</html>
